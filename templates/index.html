<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 40px 40px 40px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            color: #ffcc00;
            margin-bottom: 30px;
            text-align: center;
        }

        .content-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            width: 100%;
            max-width: 1050px; /* Increased max-width */
            gap: 30px;
        }

        form {
            background-color: #1e1e1e;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
            flex: 2; /* Make the form box wider (2 parts out of 3) */
            min-width: 400px; /* Adjust minimum width */
            max-width: 700px; /* Adjust maximum width */
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #2a2a2a;
            color: #ffffff;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #ffcc00;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            padding: 10px 20px;
            width: 100%;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #e6b800;
        }

        .prediction-area {
            background-color: #1e1e1e;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
            flex: 1; /* Keep the prediction area as 1 part */
            min-width: 250px;
            max-width: 350px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .prediction-area h3 {
            margin: 0;
            color: #00ff99;
            font-size: 1.4em;
        }

        /* Responsive adjustments */
        @media (max-width: 850px) {
            body {
                padding: 20px;
            }
            .content-wrapper {
                flex-direction: column;
                align-items: center;
                max-width: 500px;
            }

            form, .prediction-area {
                width: 100%;
                max-width: 450px;
                min-width: unset;
                flex: none;
            }
        }
        @media (max-width: 480px) {
            .form-row { flex-direction: column; gap: 15px; margin-bottom: 0; }
            .form-group { margin-bottom: 15px; }
            .form-group:last-child { margin-bottom: 0; }
            form { padding: 20px;}
            .prediction-area { padding: 20px; min-height: 100px;}
        }

    </style>
</head>
<body>
    <h2>Titanic Survival Prediction</h2>

    <div class="content-wrapper">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Pclass:</label>
                    <input type="number" name="pclass" required min="1" max="3">
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" step="any" name="age" required min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Siblings/Spouse:</label>
                    <input type="number" name="sibsp" required min="0">
                </div>
                <div class="form-group">
                    <label>Parents/Children:</label>
                    <input type="number" name="parch" required min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Total Fare:</label>
                    <input type="number" step="any" name="fare" required min="0">
                </div>
                <div class="form-group">
                    <label>Sex:</label>
                    <select name="sex">
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Embarked:</label>
                    <select name="embarked">
                        <option value="Q">Queenstown (Q)</option>
                        <option value="S">Southampton (S)</option>
                        <option value="C">Cherbourg (C)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Choose Model:</label>
                    <select name="modelname">
                        <option value="LogReg">Logistic Regression</option>
                        <option value="RanFor">Random Forest</option>
                        <option value="XGB">XGBoost</option>
                    </select>
                </div>
            </div>

            <input type="submit" value="Predict">
        </form>

        <div class="prediction-area">
            {% if prediction is not none %}
                <h3>{{ prediction }}</h3>
            {% else %}
                <p style="color: #666;">Prediction will appear here</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
